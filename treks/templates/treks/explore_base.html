{% load static %}
<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="{% static 'treks/stick-trekker.svg' %}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Which hike next?{% endblock %}</title>
<meta name="description" content="{% block meta_description %}Find Himalayan treks by month, difficulty, and altitude. Compare departure dates and flight prices from operators like Indiahikes and Trek The Himalayas.{% endblock %}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{% block canonical %}https://treks.freeup.in/{% endblock %}">
<meta property="og:title" content="{% block og_title %}Trek Planner — find your next Himalayan trek{% endblock %}">
<meta property="og:description" content="{% block og_description %}Browse upcoming treks by month, altitude, difficulty, and cost. See departure availability and flight prices at a glance.{% endblock %}">
<meta property="og:type" content="website">
<meta property="og:url" content="https://treks.freeup.in/">
<meta property="og:site_name" content="Trek Planner">
{% block structured_data %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Trek Planner",
  "url": "https://treks.freeup.in/",
  "description": "Compare Himalayan trek departures by month, difficulty, altitude, and flight cost."
}
</script>
{% endblock %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f7f7f5;
  --panel:#ffffff;
  --line:#e0e0dc;
  --text:#1a1a1a;
  --muted:#6b6b6b;
  --accent:#c77800;
  --accent-light:#f5deb3;
  --sun:#2d6a4f;
  --sun-2:#40916c;
  --sun-3:#95d5b2;
  --ink:#1a1a1a;
  --ink-2:#555555;
  --fill:#52b788;
  --fill-off:#d4d4d0;
  --tile-bg:#f0f0ec;
  --face:#f7d262;
  --hat:#6b8f3a;
}
*{box-sizing:border-box;margin:0}
body{
  background:var(--bg);color:var(--text);
  font:400 15px/1.55 'Work Sans','Arial Narrow',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.col{max-width:620px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:22px}
.display{font-family:'Big Shoulders Display','Arial Narrow',sans-serif}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
select{font:inherit;cursor:pointer}
a{color:var(--accent)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:500 13px 'Work Sans',system-ui,sans-serif;cursor:pointer;background:transparent;color:var(--text);transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"],.chip.active{background:var(--sun);color:#fff;border-color:var(--sun)}

/* select tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{background:var(--tile-bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile label{font:400 11px 'Work Sans',system-ui,sans-serif;color:var(--muted)}
.tile select{appearance:none;background:none;border:none;color:var(--text);font:600 15px 'Work Sans',system-ui,sans-serif;padding:0;width:100%}

/* cards */
.trek-card{
  background:var(--panel);color:var(--text);
  border-radius:16px;padding:14px 16px;
  border:2px solid var(--line);
  box-shadow:0 1px 3px rgba(0,0,0,.06);
  transition:border-color .2s;
}
.trek-card.focused{border-color:var(--accent)}

/* focus ring */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* motion */
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* tabular numbers */
.tabnum{font-variant-numeric:tabular-nums}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="col">
  {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
